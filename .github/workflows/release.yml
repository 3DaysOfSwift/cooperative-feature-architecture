name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (e.g. v0.1.0-beta.1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node --input-type=module -e 'import fs from "node:fs"; if(process.env.RELEASE_TAG !== "v" + JSON.parse(fs.readFileSync("package.json")).version) process.exit(1);'
      - run: python3 scripts/release.py
      - run: git diff --exit-code
      - name: Create draft with downloadable archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --draft --prerelease --title "CFA $RELEASE_TAG" --notes-file CHANGELOG.md
